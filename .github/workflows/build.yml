name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-ubuntu22-py311-v3-${{ hashFiles('buildozer.spec', 'main.py') }}
          restore-keys: |
            buildozer-ubuntu22-py311-v3-
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev
          pip install --upgrade pip
          pip install buildozer "cython<3.0"
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          yes | buildozer android debug --version >/dev/null 2>&1 || true
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools" ]; then
            yes | "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager --licenses --sdk_root="$HOME/.buildozer/android/platform/android-sdk" || true
          fi
      - name: Build with Buildozer
        run: |
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee build.log || {
            echo "=== LAST 120 CLEAN LINES ==="
            sed -r 's/\x1B\[[0-9;]*[mK]//g' build.log | tail -n 120
            exit 1
          }
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFly-APK
          path: bin/*.apk
