name: Build SHADOW DARK APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --fix-missing \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            build-essential cmake libgl1-mesa-dev libgles2-mesa-dev \
            libncurses5-dev libsqlite3-dev libreadline-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer "cython<3.0"

      - name: Build debug APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          rm -rf .buildozer
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log || {
            echo "=== LAST 60 LINES BEFORE # ENVIRONMENT: IN BUILD.LOG ==="
            awk '/^# ENVIRONMENT:/{exit} {lines[NR]=$0} END{start=(NR>60?NR-60:1); for(i=start;i<=NR;i++) print lines[i]}' build.log
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-DARK-APK
          path: bin/*.apk
          if-no-files-found: error
