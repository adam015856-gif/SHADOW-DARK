name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-ubuntu22-py311-${{ hashFiles('buildozer.spec', 'main.py') }}
          restore-keys: |
            buildozer-ubuntu22-py311-
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev
          pip install --upgrade pip
          pip install buildozer "cython<3.0"
      - name: Build with Buildozer
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log || {
            echo "=== REAL ERRORS ONLY ==="
            grep -v "performance hint:" build.log | grep -v "Possible solutions:" | grep -v "1. Declare" | grep -v "2. Use an" | grep -i -E "error:|fatal error|traceback|command failed|no such file|undefined reference" | tail -n 50 || tail -n 30 build.log
            exit 1
          }
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFly-APK
          path: bin/*.apk
