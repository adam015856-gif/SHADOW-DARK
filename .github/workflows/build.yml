- name: Build debug APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          rm -rf .buildozer
          unset LD_LIBRARY_PATH ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log || {
            python - <<'EOF'
with open("build.log", "r", errors="replace") as f:
    lines = [x.rstrip("\r\n") for x in f]

keywords = (
    "error:",
    "error ",
    "traceback",
    "exception",
    "no module named",
    "could not find",
    "failed to",
    "command failed",
)

hits = []
for i, line in enumerate(lines):
    low = line.lower()
    if line.startswith("#     "):
        continue
    if any(k in low for k in keywords) and "error code:" not in low:
        start = max(0, i - 3)
        end = min(len(lines), i + 4)
        for j in range(start, end):
            if not lines[j].startswith("#     ") and lines[j] not in hits:
                hits.append(lines[j])

print("=== REAL BUILD ERRORS ===")
for line in hits[-60:]:
    print(line)
EOF
            exit 1
          }
