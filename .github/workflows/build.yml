name: Build SHADOW DARK APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Buildozer & Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-py3.10-v6-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-py3.10-v6-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --fix-missing \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            build-essential cmake libgl1-mesa-dev libgles2-mesa-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer cython==0.29.37

      - name: Build debug APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log || {
            echo "=== TAIL OF BUILD.LOG ==="
            tail -n 80 build.log
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-DARK-APK
          path: bin/*.apk
          if-no-files-found: error
